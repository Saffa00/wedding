<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0B4D3A" />
  <title>You are offline</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#FBF8F1;color:#12332A;
      font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:2rem;text-align:center}
    main{max-width:22rem}
    h1{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;font-size:2rem;color:#0B4D3A;margin:0 0 .75rem}
    p{line-height:1.5;color:rgba(18,51,42,.75)}
    button{margin-top:1rem;width:100%;min-height:52px;border:0;border-radius:1rem;background:#0B4D3A;color:#FBF8F1;font-size:1rem;font-weight:500}
  </style>
</head>
<body>
  <main>
    <h1>You are offline</h1>
    <p>This screen needs an internet connection. Guest check-ins are only recorded when the app can reach the server, so nobody is marked as arrived while you are offline.</p>
    <button onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
